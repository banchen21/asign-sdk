[package]
name = "asign-sdk"
version = "0.1.0"
edition = "2021"
description = "爱签电子合同 OpenAPI 的 Rust 客户端 SDK"
license = "MIT"
readme = "README.md"
keywords = ["asign", "esign", "contract", "esignature", "openapi"]
categories = ["api-bindings"]
# 不进 .crate 包的内容：本机诊断示例（写死了本地密钥路径与测试账号，不该随源码公开）。
exclude = [
    "examples/",
    ".gitattributes",
]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rand = "0.8"
zip = "2"

[lib]
name = "asign_sdk"
path = "src/lib.rs"
